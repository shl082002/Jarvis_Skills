<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heimdall — situation room</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #121722;
      --ink: #e8edf7;
      --muted: #8b95a8;
      --line: #243044;
      --ok: #3dd68c;
      --stale: #f5a524;
      --unknown: #6b7385;
      --accent: #7aa2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }
    header .meta { color: var(--muted); font-size: 12px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge.ok { background: #143325; color: var(--ok); }
    .badge.STALE { background: #3a2a10; color: var(--stale); }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 12px;
      padding: 16px 24px 24px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      min-height: 120px;
    }
    section.wide { grid-column: 1 / -1; }
    h2 {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 4px 0; }
    .empty { color: var(--unknown); font-style: italic; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Heimdall</h1>
    <div class="meta">
      <span id="health" class="badge">…</span>
      <span id="generated"></span>
    </div>
  </header>
  <div class="grid">
    <section>
      <h2>Mission</h2>
      <div id="mission"></div>
      <h2 style="margin-top:14px">Next</h2>
      <div id="next"></div>
    </section>
    <section>
      <h2>NOW</h2>
      <div id="now"></div>
    </section>
    <section>
      <h2>AWAITING</h2>
      <div id="awaiting"></div>
    </section>
    <section>
      <h2>Live</h2>
      <div id="live"></div>
    </section>
    <section>
      <h2>Reports</h2>
      <div id="reports"></div>
    </section>
    <section>
      <h2>Services</h2>
      <pre id="services"></pre>
    </section>
    <section class="wide">
      <h2>Branches</h2>
      <pre id="branches"></pre>
    </section>
  </div>
  <script>
    function list(items, empty) {
      if (!items || !items.length) return '<p class="empty">' + empty + '</p>';
      return '<ul>' + items.map(function (i) {
        return '<li>' + escapeHtml(typeof i === 'string' ? i : (i.name || JSON.stringify(i))) + '</li>';
      }).join('') + '</ul>';
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
      });
    }
    function render(s) {
      var h = (s.kit_health && s.kit_health.status) || 'unknown';
      var badge = document.getElementById('health');
      badge.textContent = h;
      badge.className = 'badge ' + (h === 'STALE' ? 'STALE' : 'ok');
      document.getElementById('generated').textContent = s.generated_at || '';
      document.getElementById('mission').textContent = s.mission || '—';
      document.getElementById('next').textContent = s.next_task || '—';
      document.getElementById('now').innerHTML = list(s.lanes && s.lanes.now, 'empty');
      document.getElementById('awaiting').innerHTML = list(s.lanes && s.lanes.awaiting, 'none');
      var live = (s.live || []).map(function (a) {
        return (a.id || '?') + ' · ' + (a.status || 'unknown') + (a.mission ? ' — ' + a.mission : '');
      });
      document.getElementById('live').innerHTML = list(live, 'no heartbeats — unknown');
      var reports = (s.reports || []).map(function (r) { return r.name; });
      document.getElementById('reports').innerHTML = list(reports, 'none');
      document.getElementById('services').textContent = s.services || 'unknown';
      document.getElementById('branches').textContent = (s.branches || []).join('\n') || '—';
    }
    fetch('dist/state.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('no state'); return r.json(); })
      .then(render)
      .catch(function () {
        document.getElementById('mission').innerHTML = '<p class="empty">Run bin/heimdall project — no state.json yet.</p>';
      });
  </script>
</body>
</html>
